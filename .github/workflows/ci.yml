name: CI

on:
  push:
    branches: [main]
  pull_request:

# 唯讀就夠：這幾關只掃檔案，不需要寫 repo。
permissions:
  contents: read

jobs:
  born-clean:
    name: born-clean（秘密／身分／文件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 要掃歷史

      # ① 秘密
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ② 身分／私域值
      #    公開版沒有 .bornclean-deny（那份是私庫專用、gitignored）——
      #    本 repo 本來就不該有私有限定檔，所以「只跑通用樣態」在這裡是正確狀態，不是降級。
      - name: born-clean scan
        run: python3 scripts/bornclean_scan.py

      # ③ 文件：相對連結 + mermaid 真的渲染得出來
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install mermaid-cli
        run: npm i -g @mermaid-js/mermaid-cli

      # mmdc 底下是 puppeteer/Chrome。CI 容器沒有 user namespace，Chrome 的沙箱起不來，
      # 每張圖都會渲染失敗（本機正常、CI 全紅就是這個）。給它 --no-sandbox 即可；
      # 這裡跑的是我們自己 repo 的 .md，沒有不受信任的輸入。
      - name: puppeteer config for mmdc
        run: |
          # ① 沙箱：CI 容器沒有 user namespace，Chrome 預設沙箱起不來。
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > "$HOME/.puppeteerrc.json"
          echo "PUPPETEER_CONFIG=$HOME/.puppeteerrc.json" >> "$GITHUB_ENV"
          # ② 瀏覽器本體：npm -g 裝 mermaid-cli 時 puppeteer 不一定把 Chrome 下載到
          #    runner 使用者讀得到的位置。ubuntu runner 映像自帶 Chrome，直接指過去最穩。
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then npx --yes puppeteer browsers install chrome; else echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"; fi
          echo "chrome=$CHROME"

      - name: docs lint
        run: python3 scripts/docs_lint.py

  # ─────────────────────────────────────────────────────────────────────────
  # Android（社群貢獻）。用「有沒有動到那個目錄」決定跑不跑：
  #   · 目錄還不存在時 → 這個 job 直接 skip，不影響現有綠燈
  #   · PR 一旦動到 app/wherebear_app_android/** → 自動跑，沒有可跑的測試就是紅的
  # 只跑 JVM 單元測試（./gradlew test）。instrumented test 要模擬器，這裡不跑。
  android:
    name: Android 單元測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 有沒有動到 Android
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'app/wherebear_app_android/**'

      - uses: actions/setup-java@v4
        if: steps.changed.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # 沒有 wrapper 就直接讓它紅，並講清楚為什麼——貢獻者最容易漏這個。
      - name: 檢查 gradle wrapper
        if: steps.changed.outputs.android == 'true'
        run: |
          test -f app/wherebear_app_android/gradlew || {
            echo "::error::缺少 app/wherebear_app_android/gradlew（gradle wrapper 沒帶上，CI 無法建置）"
            exit 1
          }

      # ── wrapper jar 的兩道驗證 ───────────────────────────────────────────
      # 為什麼要驗：gradle-wrapper.jar 是一顆「跟著 PR 進來、會被 CI 執行」的二進位檔。
      # 它不是原始碼，看 diff 看不出內容，而下一步的 ./gradlew test 就是在跑它。
      # 社群 PR 一旦夾帶動過手腳的 jar，等於在 runner 上任意執行程式碼。
      # 這兩關把「肉眼看不出來」的部分交給機器，且各自抓不同的東西：

      # ① 是不是 Gradle 官方發布過的 jar（官方 action、比對已知全部版本的 checksum）
      #    抓得到：被竄改／來路不明的 jar
      #    抓不到：合法但版本對不上 distributionUrl 的 jar —— 那是下一關的事
      - name: wrapper jar 是官方發布的
        if: steps.changed.outputs.android == 'true'
        uses: gradle/actions/wrapper-validation@v4

      # ② jar 的版本跟 distributionUrl 宣告的一不一致
      #    `gradle wrapper --gradle-version X` 只改 properties，jar 用的是產生它那台機器
      #    本機那版 —— 這是 Gradle 的已知行為，很容易在不知情的狀況下把兩者送成不同版本。
      #    後果是「宣告 8.9、實際用 9.x 的 wrapper 去跑」，一個沒人驗過的組合。
      #    比對對象直接跟官方要（services.gradle.org 每個版本都發 .sha256），不自己維護清單。
      - name: wrapper jar 版本與 distributionUrl 一致
        if: steps.changed.outputs.android == 'true'
        working-directory: app/wherebear_app_android
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          jar=gradle/wrapper/gradle-wrapper.jar

          ver="$(sed -nE 's#.*gradle-([0-9][0-9.]*)-(bin|all)\.zip.*#\1#p' "$props" | head -1)"
          if [ -z "$ver" ]; then
            echo "::error file=$props::讀不出 distributionUrl 的 Gradle 版本（預期形如 gradle-8.9-bin.zip）"
            exit 1
          fi

          if ! expected="$(curl -fsSL "https://services.gradle.org/distributions/gradle-${ver}-wrapper.jar.sha256")"; then
            echo "::error file=$props::向 Gradle 官方查不到 ${ver} 的 wrapper checksum（版本號打錯，或該版本不存在）"
            exit 1
          fi

          actual="$(sha256sum "$jar" | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error file=$jar::wrapper jar 與 distributionUrl 宣告的版本不符"
            echo "  distributionUrl 宣告：Gradle ${ver}"
            echo "  該版官方 jar sha256 ：${expected}"
            echo "  這個 PR 帶進來的     ：${actual}"
            echo ""
            echo "  修法：在 app/wherebear_app_android/ 底下用該版本重新產生 wrapper，例如"
            echo "    gradle wrapper --gradle-version ${ver} --distribution-type bin"
            echo "  然後確認 gradle-wrapper.jar 真的一起變了（只改 properties 不會換 jar）。"
            exit 1
          fi
          echo "✓ wrapper jar 對得上 distributionUrl 宣告的 Gradle ${ver}"

      - name: gradlew test
        if: steps.changed.outputs.android == 'true'
        working-directory: app/wherebear_app_android
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon
